# Autenticação de clientes do PostgreSQL.
# Pela rede, aceita apenas o servidor da aplicação (172.28.0.10), com o usuário
# app_autenticacao, no banco autenticacao, via scram-sha-256. Todo o resto é recusado.

# TYPE  DATABASE      USER              ADDRESS          METHOD

# Administração local (socket Unix dentro do contêiner, sem rede): usada pelos
# scripts de inicialização e por "docker compose exec -u postgres postgres psql".
local   all           postgres                           peer

# Servidor da aplicação.
host    autenticacao  app_autenticacao  172.28.0.10/32   scram-sha-256

# Qualquer outra conexão é recusada.
local   all           all                                reject
host    all           all               0.0.0.0/0        reject
host    all           all               ::/0             reject
