spring.application.name=autenticacao

# Servidor de aplicação: só escuta no endereço local; o Nginx é o único cliente.
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=native

# Nenhum detalhe interno nas respostas de erro.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# SGBD: credenciais lidas de variáveis de ambiente (nunca fixas no código).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}
# O software não altera dados: as conexões do pool são somente leitura.
spring.datasource.hikari.read-only=true
# Esquema e carga são aplicados pelo SGBD (banco/), nunca pela aplicação.
spring.sql.init.mode=never
